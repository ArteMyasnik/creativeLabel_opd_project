<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выпадающий список с кнопками</title>
  <style>
    /* Стили для списка */
    .dropdown {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    /* Кнопка, которая открывает список */
    .dropbtn {
      background-color: #6a5acd;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Выпадающее меню */
    .dropdown-content {
      display: none; /* Скрыто по умолчанию */
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 1;
      border-radius: 5px;
    }

    /* Кнопки внутри выпадающего меню */
    .dropdown-content button {
      color: black;
      padding: 10px 20px;
      text-decoration: none;
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background-color: transparent;
      cursor: pointer;
    }

    /* Изменение цвета кнопок при наведении */
    .dropdown-content button:hover {
      background-color: #ddd;
    }

    /* Показ выпадающего меню */
    .show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="dropdown">
    <button class="dropbtn" onclick="toggleDropdown()">Меню</button>
    <div class="dropdown-content" id="dropdownContent">
      <button onclick="window.location.href='https://example.com/page1'">Страница 1</button>
      <button onclick="window.location.href='https://example.com/page2'">Страница 2</button>
      <button onclick="window.location.href='https://example.com/page3'">Страница 3</button>
    </div>
  </div>

  <script>
    // Функция для показа/скрытия выпадающего меню
    function toggleDropdown() {
      const dropdownContent = document.getElementById("dropdownContent");
      dropdownContent.classList.toggle("show");
    }

    // Закрытие выпадающего меню при клике вне его области
    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn')) {
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          const openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
  </script>

</body>
</html>
