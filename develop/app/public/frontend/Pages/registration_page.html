<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>registrtation page</title>
    <link rel="stylesheet" href="../Styles/stylesRegistrationPage.css">
  </head>
  <body>
    <div class="button-container">
      <a href="/main">
        <button>Назад</button>
      </a>
    </div>
    <div class="login-container">
      <h2>Регистрация</h2>
      <form name="registrationForm" id="registrationForm">
        <input name="login" type="text" placeholder="Введите логин" required>
        <input name="email" type="text" placeholder="Введите почту" required/>
        <input name="password" type="password" placeholder="Введите Пароль" required/>
        <input name="repassword" type="password" placeholder="Подтвердите пароль" required/>
        <div id="error" style="color: red"></div>
        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
    <script src="../../backend/registr.js"></script>
  </body>
</html>
